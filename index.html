<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E5A3C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cameron">
<title>Ovinos Cameron</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/tabler-icons.min.css">
<style>
:root{--bg:#f4f3ee;--card:#fff;--line:#e5e3db;--ink:#2c2c2a;--mut:#6f6e68;--soft:#9a998f;--acc:#2E5A3C;--ok:#27500A;--bad:#a32d2d;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
body{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
#top{position:sticky;top:0;z-index:5;background:var(--acc);color:#fff;padding:calc(13px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px;}
#top .ic{width:33px;height:33px;border-radius:9px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:18px;}
#top .bk{cursor:pointer;font-size:24px;display:flex;margin-left:-4px;}
#top h1{font-size:16px;font-weight:600;margin:0;line-height:1.1;}#top .sub{font-size:11px;opacity:.85;margin-top:1px;}
#top .act{cursor:pointer;font-size:20px;opacity:.92;}
#stage{flex:1;padding:14px;transition:opacity .16s,transform .2s;opacity:1;}
#nav{position:sticky;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);}
#nav .tb{flex:1;text-align:center;padding:9px 0 8px;cursor:pointer;color:var(--soft);transition:color .15s;}
#nav .tb i{font-size:21px;}#nav .tb div{font-size:10px;margin-top:1px;}#nav .tb.on{color:var(--acc);}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px;}
.chip{font-size:11px;padding:2px 9px;border-radius:20px;white-space:nowrap;display:inline-block;}
.row{display:flex;align-items:center;justify-content:space-between;}
.big{font-size:23px;font-weight:600;color:var(--acc);}
.met{background:var(--bg);border-radius:11px;padding:9px 8px;text-align:center;position:relative;}
.met .v{font-size:18px;font-weight:600;}.met .u{font-size:11px;color:var(--mut);font-weight:400;}
.met .l{font-size:10px;color:var(--mut);margin-top:1px;}.met .x{position:absolute;top:2px;right:5px;font-size:13px;color:var(--soft);cursor:pointer;}
.subnav{display:flex;gap:6px;overflow:auto;margin-bottom:12px;padding-bottom:2px;}
.subnav .p{white-space:nowrap;font-size:12px;padding:6px 12px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--mut);cursor:pointer;}
.subnav .p.on{background:var(--acc);color:#fff;border-color:var(--acc);}
.tl{position:relative;padding-left:20px;}
.tl:before{content:"";position:absolute;left:5px;top:5px;bottom:5px;width:2px;background:var(--line);}
.tl .it{position:relative;margin-bottom:13px;}
.tl .dot{position:absolute;left:-17px;top:3px;width:11px;height:11px;border-radius:50%;border:2px solid var(--card);}
.tl .dt{font-size:10px;color:var(--soft);}.tl .dsc{font-size:12px;color:var(--mut);margin-top:3px;}
.lst{display:flex;justify-content:space-between;align-items:flex-start;padding:9px 0;gap:10px;}
input,select,textarea,button{font-family:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);width:100%;}
button{background:var(--acc);color:#fff;border:none;font-weight:600;cursor:pointer;}
button.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);}
h3{font-size:12px;color:var(--mut);font-weight:600;margin:0 0 8px;}
.sec-h{font-size:12px;color:var(--mut);margin-bottom:9px;}.add{color:var(--acc);cursor:pointer;font-weight:600;}
.ph{width:100%;border-radius:11px;margin-top:8px;display:block;}.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;margin-top:6px;}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20;}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;}
label{font-size:12px;color:var(--mut);display:block;margin:9px 0 4px;}
.fab{position:fixed;bottom:64px;right:calc(50% - 260px + 14px);z-index:6;}@media(max-width:540px){.fab{right:14px;}}
.fab button{width:auto;border-radius:24px;padding:11px 16px;box-shadow:0 3px 10px rgba(0,0,0,.18);}
</style>
</head>
<body>
<div id="top"></div>
<div id="stage"></div>
<div id="fab" class="fab"></div>
<div id="nav"></div>
<div id="modal"></div>
<datalist id="pots"></datalist>
<script>
var CAT={Ovejas:["#EAF3DE","#27500A"],Borregas:["#E1F5EE","#085041"],Capones:["#FAEEDA","#633806"],Carneros:["#EEEDFE","#3C3489"],Corderos:["#E6F1FB","#0C447C"],"Refugo/CUL":["#FCEBEB","#791F1F"]};
var TIPO={Conteo:["#E1F5EE","#085041"],Movimiento:["#F1EFE8","#444441"],Traspaso:["#FAEEDA","#633806"],Ingreso:["#EAF3DE","#27500A"],Muerte:["#FCEBEB","#791F1F"],Venta:["#FCEBEB","#791F1F"],Compra:["#EAF3DE","#27500A"],Dosificación:["#E6F1FB","#0C447C"],Desparasitación:["#E6F1FB","#0C447C"],Vacunación:["#E6F1FB","#0C447C"],Encaste:["#FBEAF0","#72243E"],Señalada:["#FBEAF0","#72243E"],Esquila:["#FAEEDA","#633806"],Comentario:["#F1EFE8","#444441"]};
var TIPOS=Object.keys(TIPO).filter(function(k){return k!="Ingreso";});
var SANIDAD=["Dosificación","Desparasitación","Vacunación"];
var PRODUCTOS=["Vitamina ADE","Ivermectina 1%","Levamisol","Closantel","Clostrivac 1","Clostrivac 2","Otro"];
var POTREROS=["El 1","Faja del 1","1 de arriba","Baño de arriba","Baño del medio","Baño de abajo","El consumo","La antena","Toros 1","Toros 2 (siembra)","Toros 2 (natural)","Toros 3","Toros 4","Tropilla 1","Tropilla 2","Tropilla 3","8 de abajo","8 de arriba","Bautismo","Pantano de abajo","Pantano de arriba","9 de arriba"];
document.getElementById("pots").innerHTML=POTREROS.map(function(p){return '<option value="'+p+'">';}).join("");
var MES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
function newUid(){return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function seed(){return {rebanos:[
 {uid:"r1",id:"L1",cat:"Ovejas",estado:"activo",potreros:["El 1","1 de arriba"],campos:[],ev:[
   {f:"2025-03-01",t:"Conteo",n:820,x:"Conteo inicial de la majada"},{f:"2025-04-20",t:"Encaste",ovejas:815,carneros:20,x:""},{f:"2025-09-20",t:"Esquila",etipo:"Completa",x:""},{f:"2025-12-15",t:"Señalada",corderos:690,x:"Total de corderos del lote"},{f:"2026-02-20",t:"Traspaso",n:665,destino:"r5",x:"Destete: corderos a L5"},{f:"2026-03-15",t:"Dosificación",prod:"Vitamina ADE",ml:"1 ml",x:""},{f:"2026-05-10",t:"Traspaso",n:300,destino:"r4",x:"Formación de L4"},{f:"2026-05-20",t:"Muerte",n:6,x:"Predación (zorro)"},{f:"2026-06-10",t:"Conteo",n:490,x:"Conteo en manga"},{f:"2026-06-15",t:"Movimiento",potreros:["El 1","1 de arriba"],x:"Puertas abiertas entre potreros"}]},
 {uid:"r2",id:"L2",cat:"Borregas",estado:"activo",potreros:["Faja del 1"],campos:[],ev:[{f:"2025-03-01",t:"Conteo",n:310,x:"Conteo inicial"},{f:"2026-03-15",t:"Desparasitación",prod:"Ivermectina 1%",ml:"1 ml/50kg",x:""},{f:"2026-07-02",t:"Conteo",n:308,x:""}]},
 {uid:"r3",id:"L3",cat:"Capones",estado:"activo",potreros:["Toros 1"],campos:[],ev:[{f:"2025-03-01",t:"Conteo",n:460,x:"Conteo inicial"},{f:"2025-09-20",t:"Esquila",etipo:"Completa",x:""},{f:"2026-07-05",t:"Muerte",n:3,x:"Neumonía"},{f:"2026-07-08",t:"Venta",n:200,x:"Frigorífico"}]},
 {uid:"r4",id:"L4",cat:"Ovejas",estado:"activo",potreros:["Tropilla 1"],campos:[],ev:[{f:"2026-05-10",t:"Ingreso",n:300,origen:"r1",x:"Separadas de L1"}]},
 {uid:"r5",id:"L5",cat:"Corderos",estado:"activo",potreros:["El 1"],campos:[],ev:[{f:"2026-02-20",t:"Ingreso",n:665,origen:"r1",x:"Destete de L1"},{f:"2026-04-01",t:"Muerte",n:10,x:"Frío/debilidad"}]},
 {uid:"r6",id:"L6",cat:"Carneros",estado:"activo",potreros:["La antena"],campos:[],ev:[{f:"2025-03-01",t:"Conteo",n:22,x:"Padres Corriedale"}]},
 {uid:"r7",id:"L7",cat:"Refugo/CUL",estado:"activo",potreros:["Bautismo"],campos:[],ev:[{f:"2026-06-20",t:"Conteo",n:40,x:"Ovejas viejas"}]}
],faenas:[
 {fecha:"2026-01-15",t:"Recuento de verano",k:"Conteo",lote:null},{fecha:"2026-03-10",t:"Dosificación general",k:"Dosificación",lote:null},{fecha:"2026-04-20",t:"Encaste",k:"Encaste",lote:"r1"},{fecha:"2026-05-15",t:"Venta de capones",k:"Venta",lote:"r3"},{fecha:"2026-06-05",t:"Vacunación Clostrivac 1",k:"Vacunación",lote:null},{fecha:"2026-07-05",t:"Vacunación Clostrivac 2",k:"Vacunación",lote:null},{fecha:"2026-07-10",t:"Antiparasitario",k:"Desparasitación",lote:null},{fecha:"2026-09-20",t:"Esquila pre-parición",k:"Esquila",lote:null},{fecha:"2026-12-10",t:"Señalada",k:"Señalada",lote:"r1"}
]};}
var S;try{S=JSON.parse(localStorage.getItem("cameron_v5"))||seed();}catch(e){S=seed();}
function save(){try{localStorage.setItem("cameron_v5",JSON.stringify(S));}catch(e){alert("No se pudo guardar (memoria llena).");}}
function byF(a,b){return a.f<b.f?-1:1;}
function rebByUid(u){return S.rebanos.filter(function(r){return r.uid==u;})[0];}
function nameOf(u){var r=rebByUid(u);return r?r.id:(u||"?");}
function cant(r){var run=0;r.ev.slice().sort(byF).forEach(function(e){if(e.t=="Conteo")run=+e.n||0;else if(e.t=="Muerte"||e.t=="Venta"||e.t=="Traspaso")run-=+e.n||0;else if(e.t=="Compra"||e.t=="Ingreso")run+=+e.n||0;});return run;}
function last(r,t){var a=r.ev.filter(function(e){return e.t==t;}).sort(byF);return a.length?a[a.length-1]:null;}
function paricion(r){var e=last(r,"Encaste"),s=last(r,"Señalada");if(e&&s&&e.ovejas&&s.corderos)return Math.round(1000*s.corderos/e.ovejas)/10;return null;}
function fmt(iso){if(!iso)return "";var p=iso.split("-");return p[2]+"/"+p[1]+"/"+p[0];}
function chip(t,p){p=p||["#F1EFE8","#444441"];return '<span class="chip" style="background:'+p[0]+';color:'+p[1]+'">'+t+'</span>';}
function catChip(r){return r.cat?chip(r.cat,CAT[r.cat]||["#F1EFE8","#444441"]):'';}
function esc(s){return (s+"").replace(/</g,"&lt;");}
function evDesc(e){if(e.t=="Conteo")return "Contadas: "+(e.n||0)+(e.x?" · "+esc(e.x):"");if(e.t=="Traspaso")return (e.n||0)+" → "+esc(nameOf(e.destino))+(e.x?" · "+esc(e.x):"");if(e.t=="Ingreso")return (e.n||0)+" ← "+esc(nameOf(e.origen))+(e.x?" · "+esc(e.x):"");if(e.t=="Muerte"||e.t=="Venta"||e.t=="Compra")return (e.n||0)+(e.x?" · "+esc(e.x):"");if(SANIDAD.indexOf(e.t)>=0)return (e.prod||"")+(e.ml?" · "+esc(e.ml):"")+(e.x?" · "+esc(e.x):"");if(e.t=="Encaste")return (e.ovejas||0)+" ovejas · "+(e.carneros||0)+" carneros"+(e.ovejas&&e.carneros?" (1:"+Math.round(e.ovejas/e.carneros)+")":"");if(e.t=="Señalada")return (e.corderos||0)+" corderos"+(e.x?" · "+esc(e.x):"");if(e.t=="Esquila")return (e.etipo||"")+(e.x?" · "+esc(e.x):"");if(e.t=="Movimiento")return (e.potreros||[]).join(" + ")+(e.x?" · "+esc(e.x):"");return esc(e.x||"");}
function evDelta(e){if(e.t=="Muerte"||e.t=="Venta"||e.t=="Traspaso")return -(+e.n||0);if(e.t=="Compra"||e.t=="Ingreso")return +e.n||0;return 0;}
function activos(){return S.rebanos.filter(function(r){return r.estado!="cerrado";});}
function cerrados(){return S.rebanos.filter(function(r){return r.estado=="cerrado";});}

var view="rebanos",sel=null,sub="resumen",edit=false;
var stage=document.getElementById("stage"),nav=document.getElementById("nav"),topEl=document.getElementById("top"),fab=document.getElementById("fab"),modal=document.getElementById("modal");
history.replaceState({v:"rebanos"},"");
window.addEventListener("popstate",function(e){var s=e.state||{v:"rebanos"};view=s.v||"rebanos";sel=s.sel?rebByUid(s.sel):null;sub=s.sub||"resumen";edit=false;draw();});
function nav2(v,dir){window.scrollTo(0,0);history.pushState({v:v,sel:sel?sel.uid:null,sub:sub},"");anim(dir);view=v;draw();}
function anim(dir){stage.style.opacity="0";stage.style.transform=dir=="in"?"translateX(16px)":(dir=="back"?"translateX(-16px)":"translateY(8px)");setTimeout(function(){stage.style.transform="translateX(0)";stage.style.opacity="1";},140);}
function draw(){topbar();({rebanos:rebanos,archivo:archivo,rebano:rebano,calendario:cal,campo:campo}[view])();navbar();fabber();}
function topbar(){
 var T={rebanos:"Rebaños",archivo:"Archivo",rebano:sel?sel.id+(sel.cat?" · "+sel.cat:""):"",calendario:"Calendario",campo:"Historia del campo"};
 var left=(view=="rebano"||view=="archivo")?'<span class="bk" id="bk"><i class="ti ti-chevron-left"></i></span>':'<div class="ic"><i class="ti ti-mountain"></i></div>';
 var right="";
 if(view=="rebanos"&&cerrados().length)right='<span class="act" id="arch" title="Archivo"><i class="ti ti-folder"></i></span>';
 if(view=="rebano"&&sub=="resumen")right='<span class="act" id="edt" style="font-size:13px">'+(edit?"Listo":"Editar")+'</span>';
 topEl.innerHTML=left+'<div style="flex:1"><h1>'+T[view]+(sel&&sel.estado=="cerrado"?' <span style="font-size:11px;opacity:.8">(cerrado)</span>':'')+'</h1><div class="sub">Estancia Cameron</div></div>'+right;
 var b=document.getElementById("bk");if(b)b.onclick=function(){history.back();};
 var e=document.getElementById("edt");if(e)e.onclick=function(){edit=!edit;draw();};
 var a=document.getElementById("arch");if(a)a.onclick=function(){nav2("archivo","in");};
}
function potChips(r){return r.potreros.map(function(p){return chip(p,["#EAF3DE","#27500A"]);}).join(" ");}
function cardRebano(r,cerr){return '<div class="card lc" data-u="'+r.uid+'" style="cursor:pointer;'+(cerr?"opacity:.7":"")+'"><div class="row"><div><div style="font-size:16px;font-weight:600;margin-bottom:5px">'+esc(r.id)+'</div>'+catChip(r)+'</div><div style="text-align:right"><div class="big">'+cant(r)+'</div><div style="font-size:10px;color:var(--soft);max-width:150px"><i class="ti ti-map-pin" style="font-size:11px;vertical-align:-1px"></i> '+r.potreros.map(esc).join(", ")+' <i class="ti ti-chevron-right" style="font-size:12px;vertical-align:-1px"></i></div></div></div></div>';}
function bindCards(){[].forEach.call(document.querySelectorAll(".lc"),function(el){el.onclick=function(){sel=rebByUid(el.getAttribute("data-u"));sub="resumen";nav2("rebano","in");};});}
function rebanos(){
 var act=activos(),tot=act.reduce(function(s,r){return s+cant(r);},0);
 var h='<div class="card row"><div><div style="font-size:12px;color:var(--mut)">Total animales</div><div class="big" style="font-size:27px">'+tot.toLocaleString("es-CL")+'</div></div><div style="text-align:right;color:var(--mut);font-size:12px">'+act.length+' rebaños</div></div>';
 act.forEach(function(r){h+=cardRebano(r);});
 stage.innerHTML=h;bindCards();
}
function archivo(){
 var cer=cerrados();
 var h='<div class="sec-h"><i class="ti ti-folder" style="vertical-align:-2px"></i> Rebaños cerrados — su historia queda guardada acá</div>';
 if(!cer.length)h+='<div style="color:var(--soft);font-size:13px">No hay rebaños cerrados todavía.</div>';
 cer.forEach(function(r){h+=cardRebano(r,true);});
 stage.innerHTML=h;bindCards();
}
function subnav(){var tabs=[["resumen","Resumen"],["sanidad","Sanidad"],["reproduccion","Reproducción"],["movimientos","Movimientos"],["historial","Historial"]];return '<div class="subnav">'+tabs.map(function(t){return '<span class="p '+(sub==t[0]?"on":"")+'" data-s="'+t[0]+'">'+t[1]+'</span>';}).join("")+'</div>';}
function rebano(){
 var r=sel,h=subnav();
 if(sub=="resumen")h+=resumen(r);else if(sub=="sanidad")h+=sanidad(r);else if(sub=="reproduccion")h+=repro(r);else if(sub=="movimientos")h+=movs(r);else h+=hist(r);
 stage.innerHTML=h;
 [].forEach.call(document.querySelectorAll(".subnav .p"),function(el){el.onclick=function(){sub=el.getAttribute("data-s");edit=false;draw();};});
 bind(r);
}
function met(v,l,u,rm){return '<div class="met">'+(rm!=null&&edit?'<span class="x" data-rm="'+rm+'">×</span>':'')+'<div class="v">'+v+'<span class="u">'+(u||"")+'</span></div><div class="l">'+l+'</div></div>';}
function resumen(r){
 var uc=last(r,"Conteo"),par=paricion(r);
 var m='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:6px">';
 m+='<div class="met"><div class="v">'+cant(r)+'</div><div class="l">Animales</div></div>';
 m+='<div class="met"><div class="v" style="font-size:14px">'+(uc?fmt(uc.f):"—")+'</div><div class="l">Últ. conteo</div></div>';
 m+='<div class="met"><div class="v">'+(par!=null?par:"—")+'<span class="u">%</span></div><div class="l">Parición</div></div>';
 r.campos.forEach(function(c,i){m+=met('<span style="font-size:14px">'+esc(c[1])+'</span>',esc(c[0]),"",i);});
 if(edit)m+='<div class="met" id="addf" style="cursor:pointer;border:1px dashed var(--line)"><div class="v" style="color:var(--acc)">+</div><div class="l">Indicador</div></div>';
 m+='</div>';
 m+='<div class="card" style="margin-top:10px"><span style="font-size:12px;color:var(--mut)"><i class="ti ti-map-pin" style="vertical-align:-2px"></i> Potreros actuales</span><div style="margin-top:8px">'+potChips(r)+'</div></div>';
 m+='<h3 style="margin-top:6px">Últimos eventos</h3><div class="tl">';
 r.ev.slice().sort(byF).reverse().slice(0,4).forEach(function(e){var p=TIPO[e.t];m+='<div class="it"><div class="dot" style="background:'+(p?p[1]:"#444")+'"></div><div class="dt">'+fmt(e.f)+'</div><div style="margin-top:2px">'+chip(e.t,p)+'</div><div class="dsc">'+evDesc(e)+'</div></div>';});
 m+='</div>';
 if(edit){m+='<div style="display:flex;gap:8px;margin-top:8px"><button class="ghost" id="renom"><i class="ti ti-pencil" style="vertical-align:-2px"></i> Renombrar</button><button class="ghost" id="borrar" style="flex:0 0 46px;color:var(--bad)"><i class="ti ti-trash"></i></button></div>';
  m+=(r.estado!="cerrado"?'<button id="cerrar" style="margin-top:8px"><i class="ti ti-archive" style="vertical-align:-2px"></i> Cerrar y archivar rebaño</button>':'<button class="ghost" id="reabrir" style="margin-top:8px">Reabrir rebaño</button>');}
 return m;
}
function sanidad(r){
 var evs=r.ev.filter(function(e){return SANIDAD.indexOf(e.t)>=0;}).sort(byF).reverse();
 var h='<div class="row" style="margin-bottom:8px"><h3 style="margin:0">Dosis, desparasitaciones y vacunas</h3><span class="add" id="adds"><i class="ti ti-plus" style="vertical-align:-2px"></i></span></div>';
 if(!evs.length)h+='<div style="color:var(--soft);font-size:13px">Sin registros. Tocá + para agregar.</div>';

  if(n){if(org.indexOf("from:")==0){var src=org.slice(5);ev.push({f:hoy,t:"Ingreso",n:n,origen:src,x:"Desde "+nameOf(src)});var s=rebByUid(src);if(s)s.ev.push({f:hoy,t:"Traspaso",n:n,destino:u,x:"Formación de "+id});}
   else ev.push({f:hoy,t:"Conteo",n:n,x:org=="compra"?"Compra":"Conteo inicial"});}
  S.rebanos.push({uid:u,id:id,cat:document.getElementById("rc").value,estado:"activo",potreros:pot.length?pot:["—"],campos:[],ev:ev});save();close();draw();};
}

draw();
